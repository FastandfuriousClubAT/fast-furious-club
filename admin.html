<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FFC – Administrace výletů</title>
<style>
:root{color-scheme:light;--navy:#102b3b;--gold:#ffd21f;--green:#a4f52b;--muted:#60717c}*{box-sizing:border-box}body{margin:0;background:#f2f5f6;color:#142b38;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--navy);color:white;border-radius:18px;padding:20px 24px}.head h1{margin:0;font-size:clamp(22px,4vw,32px)}.head p{margin:4px 0 0;color:#d8e5eb}.panel{background:white;border:1px solid #dce4e8;border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 5px 20px #0d27320b}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,textarea,select{font:inherit;width:100%;border:1px solid #cbd6dc;border-radius:9px;padding:11px;background:white;color:#142b38}textarea{min-height:86px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 16px;font:700 15px system-ui;cursor:pointer;background:var(--gold);color:#142b38}.btn.dark{background:var(--navy);color:white}.btn.light{background:#e7eef1}.btn.red{background:#fee2e2;color:#8d2020}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:var(--muted)}.status{padding:10px 12px;border-radius:9px;background:#eef5f7;margin-top:12px;white-space:pre-wrap}.trip{border:1px solid #dce4e8;border-radius:12px;padding:14px;margin-top:12px}.trip h3{margin:0 0 4px}.tag{display:inline-block;border-radius:30px;padding:3px 9px;background:#e8f3d8;font-size:12px;font-weight:800}.tag.off{background:#edf0f2}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{border:1px solid #ccd6db;background:white;padding:8px 12px;border-radius:8px;cursor:pointer}.tabs button.active{background:var(--navy);color:white}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px 10px 40px}.panel{padding:15px}}
</style></head><body><main class="wrap">
<header class="head"><div><h1>Fast & Furious Club</h1><p>Administrace výletů a push oznámení</p></div><a href="./" style="color:#fff">← Zpět na web</a></header>
<section class="panel" id="loginPanel"><h2>Přihlášení administrátora</h2><form id="loginForm" class="grid" onsubmit="event.preventDefault()"><div class="field full"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required value="odtahy.aut@gmail.com"></div><div class="field full"><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password" required></div><div class="full"><button class="btn dark">Přihlásit se</button></div></form><div class="status" id="loginStatus" role="status"></div></section>
<section class="panel hidden" id="appPanel"><div class="topline"><div><h2 style="margin:0">Správa výletů</h2><div class="muted" id="who"></div></div><button class="btn light" id="logout">Odhlásit se</button></div>
<div class="tabs"><button class="active" id="newTab">＋ Nový výlet</button><button id="listTab">Zveřejněné a rozpracované</button></div>
<div id="editor"><form id="tripForm" class="grid">
<input type="hidden" id="tripId">
<div class="field"><label for="title_de">Název – německy *</label><input id="title_de" required maxlength="160"></div><div class="field"><label for="title_cz">Název – česky *</label><input id="title_cz" required maxlength="160"></div><div class="field full"><label for="title_uk">Назва – українською *</label><input id="title_uk" required maxlength="160"></div>
<div class="field"><label for="description_de">Popis – německy</label><textarea id="description_de"></textarea></div><div class="field"><label for="description_cz">Popis – česky</label><textarea id="description_cz"></textarea></div><div class="field full"><label for="description_uk">Опис – українською</label><textarea id="description_uk"></textarea></div>
<div class="field full"><label for="destination">Destinace / místo *</label><input id="destination" required maxlength="180" placeholder="Např. Budapešť"></div>
<div class="field"><label for="departure_date">Odjezd</label><input id="departure_date" type="date"></div><div class="field"><label for="return_date">Návrat</label><input id="return_date" type="date"></div>
<div class="field"><label for="price">Cena</label><input id="price" type="number" min="0" step="0.01"></div><div class="field"><label for="currency">Měna</label><select id="currency"><option>EUR</option><option>CZK</option><option>USD</option></select></div>
<div class="field full"><label for="booking_url">Odkaz na rezervaci (volitelné)</label><input id="booking_url" type="url" placeholder="https://…"></div>
<div class="field full"><label><input id="published" type="checkbox" style="width:auto"> Zveřejnit výlet</label><small class="muted">Při prvním zveřejnění se odešle push oznámení odběratelům.</small></div>
<div class="actions full"><button class="btn dark" id="saveButton">Uložit výlet</button><button class="btn light" type="button" id="clearButton">Vyčistit formulář</button></div></form><div class="status" id="formStatus" role="status"></div></div>
<div id="tripList" class="hidden"><div class="actions"><button class="btn light" id="refresh">Obnovit seznam</button></div><div id="items"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById(\'loginStatus\').textContent=\'Nepodařilo se načíst přihlašovací knihovnu. Zkontroluj připojení a obnov stránku.\'"></script><script>
const URL="https://ljvcxwaipoepefwfdmnu.supabase.co", KEY="sb_publishable_pH0P9QZGE7BNIXKiUHwKag_8XxTiJ07";
if(!window.supabase||typeof window.supabase.createClient!=="function"){document.getElementById("loginStatus").textContent="Přihlašovací služba se nenačetla. Obnov stránku nebo zkus jiné připojení.";throw new Error("Supabase SDK unavailable");}
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let session=null;
function msg(id,s){$(id).textContent=s||""}
function showApp(user){session=user;$("loginPanel").classList.toggle("hidden",!!user);$("appPanel").classList.toggle("hidden",!user);if(user)$("who").textContent="Přihlášen: "+(user.email||"");}
async function checkAdmin(user){const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();if(error||!data)throw new Error("Tento účet nemá administrátorská práva.");}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();msg("loginStatus","Přihlašuji…");const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){msg("loginStatus",error.message);return;}try{await checkAdmin(data.user);showApp(data.user);msg("loginStatus","");}catch(err){await db.auth.signOut();msg("loginStatus",err.message);}});
$("logout").onclick=async()=>{await db.auth.signOut();showApp(null)};
$("newTab").onclick=()=>{$("editor").classList.remove("hidden");$("tripList").classList.add("hidden");$("newTab").classList.add("active");$("listTab").classList.remove("active")};
$("listTab").onclick=async()=>{$("editor").classList.add("hidden");$("tripList").classList.remove("hidden");$("listTab").classList.add("active");$("newTab").classList.remove("active");await loadTrips()};
$("refresh").onclick=loadTrips;
function clearForm(){$("tripForm").reset();$("tripId").value="";$("currency").value="EUR";msg("formStatus","")}
$("clearButton").onclick=clearForm;
function getForm(){return {title_de:$("title_de").value.trim(),title_cz:$("title_cz").value.trim(),title_uk:$("title_uk").value.trim(),description_de:$("description_de").value.trim(),description_cz:$("description_cz").value.trim(),description_uk:$("description_uk").value.trim(),destination:$("destination").value.trim(),departure_date:$("departure_date").value||null,return_date:$("return_date").value||null,price:$("price").value===""?null:Number($("price").value),currency:$("currency").value,booking_url:$("booking_url").value.trim()||null,published:$("published").checked}}
$("tripForm").addEventListener("submit",async e=>{e.preventDefault();$("saveButton").disabled=true;msg("formStatus","Ukládám…");try{const payload=getForm(),id=$("tripId").value;let result;if(id){result=await db.from("trips").update({...payload,updated_at:new Date().toISOString()}).eq("id",id).select().single()}else{result=await db.from("trips").insert(payload).select().single()}if(result.error)throw result.error;const trip=result.data;if(payload.published&&!trip.push_sent_at){msg("formStatus","Výlet je uložen a zveřejněn. Odesílám push oznámení…");const {data,error}=await db.functions.invoke("ffc-push-trip",{body:{trip_id:trip.id}});if(error)throw error;if(!data?.success)throw new Error(data?.error||"Push oznámení se nepodařilo odeslat.");msg("formStatus",data.already_sent?"Výlet je zveřejněn. Oznámení už bylo odesláno.":"Výlet je zveřejněn a push oznámení bylo předáno OneSignal.");}else msg("formStatus","Výlet byl uložen.");$("tripId").value=trip.id;}catch(err){msg("formStatus","Chyba: "+(err.message||String(err)))}finally{$("saveButton").disabled=false;}});
function editTrip(t){$("tripId").value=t.id;for(const k of ["title_de","title_cz","title_uk","description_de","description_cz","description_uk","destination","departure_date","return_date","price","currency","booking_url"])$(k).value=t[k]??"";$("published").checked=!!t.published;$("newTab").click();window.scrollTo({top:0,behavior:"smooth"})}
async function removeTrip(id){if(!confirm("Opravdu smazat tento výlet?"))return;const {error}=await db.from("trips").delete().eq("id",id);if(error){alert(error.message);return;}await loadTrips()}
async function loadTrips(){msg("formStatus","");$("items").textContent="Načítám…";const {data,error}=await db.from("trips").select("*").order("created_at",{ascending:false});if(error){$("items").textContent=error.message;return;}if(!data.length){$("items").textContent="Zatím zde nejsou žádné výlety.";return;}$("items").innerHTML="";for(const t of data){const el=document.createElement("article");el.className="trip";const h=document.createElement("h3");h.textContent=t.title_cz+" · "+t.destination;const p=document.createElement("p");p.className="muted";p.textContent=(t.departure_date||"Termín neuveden")+" · "+(t.price==null?"Cena na dotaz":t.price+" "+t.currency);const tag=document.createElement("span");tag.className="tag "+(t.published?"":"off");tag.textContent=t.published?"ZVEŘEJNĚNO":"ROZPRACOVÁNO";const sent=document.createElement("small");sent.className="muted";sent.textContent=t.push_sent_at?" · Push odeslán":" · Push zatím neodeslán";const actions=document.createElement("div");actions.className="actions";const edit=document.createElement("button");edit.className="btn light";edit.textContent="Upravit";edit.onclick=()=>editTrip(t);const del=document.createElement("button");del.className="btn red";del.textContent="Smazat";del.onclick=()=>removeTrip(t.id);actions.append(edit,del);el.append(h,p,tag,sent,actions);$("items").append(el)}}
$("clearButton").click();
db.auth.getSession().then(async({data})=>{if(data.session){try{await checkAdmin(data.session.user);showApp(data.session.user)}catch{await db.auth.signOut();showApp(null)}}});
db.auth.onAuthStateChange(async(_event,s)=>{if(s?.user){try{await checkAdmin(s.user);showApp(s.user)}catch{showApp(null)}}else showApp(null)});
</script></body></html>
